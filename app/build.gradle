plugins {
    id "com.android.application"
}

android {
    namespace "com.alfredmapper2"
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    defaultConfig {
        applicationId "com.alfredmapper2"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
